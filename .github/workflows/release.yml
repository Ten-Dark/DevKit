name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.5'

jobs:
  # ---------------------------------------------------------------- typecheck -----
  typecheck:
    name: TypeScript Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Upload TypeScript error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-logs
          path: |
            *.log
            **/*.log
          retention-days: 3

  # ---------------------------------------------------------------- unit-tests --
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Upload test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            vitest.log
            test-results/**
          retention-days: 3

  # ---------------------------------------------------------------- integration -
  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (IPC + updater)
        run: npx vitest run src/main/ipc-registry.test.ts src/main/updater/updater.integration.test.ts

      - name: Upload integration test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            vitest.log
            test-results/**
          retention-days: 3

  # ------------------------------------------------------- dev-e2e --------------
  dev-e2e:
    name: Dev Electron E2E
    runs-on: windows-latest
    needs: [typecheck, unit-tests, integration-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Build Electron app for Dev E2E
        run: npm run build

      - name: Verify Electron runtime files
        shell: pwsh
        run: |
          $requiredPaths = @(
            'package.json',
            'dist-electron/main/main.js',
            'dist-electron/preload/preload.cjs',
            'node_modules/electron/dist/electron.exe',
            'node_modules/electron/dist/resources'
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required Electron runtime path is missing: $requiredPath"
            }
          }
          node -e "const { spawnSync } = require('node:child_process'); const result = spawnSync('node_modules/electron/dist/electron.exe', ['--version'], { encoding: 'utf8' }); if (result.error || result.status !== 0) { console.error(result.stderr || result.error || ('Electron exited: ' + result.status)); process.exit(1); } process.stdout.write(result.stdout || '');"

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Dev Electron E2E
        run: npm run test:e2e:dev

      - name: Upload E2E logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-e2e-logs
          path: |
            playwright-report/**
            test-results/**
            vite-dev.log
          retention-days: 3

  # ----------------------------------------------------- production-build -------
  production-build:
    name: Production Build
    runs-on: windows-latest
    needs: [typecheck, unit-tests, integration-tests, dev-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build (tsc + vite)
        run: npm run build

      - name: Upload build output for dist job
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist-electron/main/**
            dist-electron/preload/**
            dist-electron/shared/**
            dist-electron/renderer/**
          retention-days: 7

      - name: Upload build logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            dist-electron/builder-debug.yml
            dist-electron/builder-effective-config.yaml
          retention-days: 3

  # --------------------------------------------------------- dist --------------
  dist:
    name: Production Package (dist)
    runs-on: windows-latest
    needs: [production-build]
    env:
      REQUIRE_WINDOWS_CODE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare and validate Windows signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw "Missing WINDOWS_SIGNING_CERT_BASE64 repository secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER_NAME)) {
            throw "Missing WINDOWS_PUBLISHER_NAME repository secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing WINDOWS_SIGNING_CERT_PASSWORD repository secret."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'devkit-windows-signing.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:WIN_CSC_KEY_PASSWORD,
            $flags
          )
          if (-not $certificate.HasPrivateKey) { throw "The PFX does not contain a private signing key." }
          if ($certificate.NotBefore -gt [DateTime]::UtcNow -or $certificate.NotAfter -le [DateTime]::UtcNow) {
            throw "The Windows signing certificate is not currently valid."
          }
          $publisher = $certificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          if ($publisher -cne $env:WINDOWS_PUBLISHER_NAME) {
            throw "WINDOWS_PUBLISHER_NAME does not exactly match the certificate subject publisher."
          }
          $hasCodeSigningEku = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }
          if (-not $hasCodeSigningEku) { throw "The certificate does not contain the Code Signing EKU." }

          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated Windows signing certificate publisher: $publisher"

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist-electron

      - name: Run electron-builder (dist)
        run: npm run dist:from-build

      - name: Upload unpacked app artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked-app
          path: dist-electron/win-unpacked/**
          retention-days: 7

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: |
            dist-electron/Dev Toolbox Setup *.exe
            dist-electron/Dev Toolbox Setup *.exe.blockmap
            dist-electron/latest.yml
          retention-days: 7

      - name: Upload dist logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-logs
          path: |
            dist-electron/builder-debug.yml
          retention-days: 3

  # -------------------------------------------------- validate:asar -------------
  validate-asar:
    name: ASAR Validation
    runs-on: windows-latest
    env:
      REQUIRE_WINDOWS_CODE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
    needs: [dist]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download unpacked app artifact
        uses: actions/download-artifact@v4
        with:
          name: win-unpacked-app
          path: dist-electron/win-unpacked/

      - name: Run ASAR validation
        run: npm run validate:asar -- dist-electron/win-unpacked/resources/app.asar

  # ------------------------------------------------- packaged-e2e -------------
  packaged-e2e:
    name: Packaged Electron E2E
    runs-on: windows-latest
    env:
      REQUIRE_WINDOWS_CODE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
    needs: [dist]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Download unpacked app artifact
        uses: actions/download-artifact@v4
        with:
          name: win-unpacked-app
          path: dist-electron/win-unpacked/

      - name: Run Packaged Electron E2E
        run: npm run test:e2e:packaged

      - name: Upload packaged E2E logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-e2e-logs
          path: |
            playwright-report/**
            test-results/**
          retention-days: 3

  # ------------------------------------------------------- nsis ---------------
  nsis-installer-e2e:
    name: NSIS Installer E2E
    runs-on: windows-latest
    env:
      REQUIRE_WINDOWS_CODE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
    needs: [dist]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Download NSIS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: nsis-installer
          path: dist-electron/

      - name: Install Dev Toolbox silently
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $installerPath = Join-Path 'dist-electron' "Dev Toolbox Setup $version.exe"
          if (-not (Test-Path $installerPath -PathType Leaf)) {
            throw "NSIS installer for package version $version not found at $installerPath"
          }
          $installDir = "C:\Test\DevToolbox-Install"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $installerProcess = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($installerProcess.ExitCode -ne 0) {
            throw "NSIS installer failed with exit code $($installerProcess.ExitCode)"
          }
          $installedExe = Join-Path $installDir 'Dev Toolbox.exe'
          if (-not (Test-Path $installedExe)) {
            throw "NSIS installer completed without creating $installedExe"
          }

      - name: Run Packaged Electron E2E against installed EXE
        shell: pwsh
        run: |
          $exePath = "C:\Test\DevToolbox-Install\Dev Toolbox.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Installed executable not found at $exePath"
            exit 1
          }
          $env:NODE_ENV = "production"
          $env:PACKAGED_EXE = $exePath
          npx playwright test tests/e2e/packaged.spec.ts

      - name: Upload installer E2E logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer-e2e-logs
          path: |
            playwright-report/**
            test-results/**
          retention-days: 3

      - name: Cleanup test installation
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Test\DevToolbox-Install" -ErrorAction SilentlyContinue

  # -------------------------------------------------------- release -----------
  release:
    name: Create GitHub Release
    runs-on: windows-latest
    env:
      REQUIRE_WINDOWS_CODE_SIGNING: '1'
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
    permissions:
      contents: write
    needs: [validate-asar, packaged-e2e, nsis-installer-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download NSIS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: nsis-installer
          path: dist-electron/

      - name: Download unpacked application for signature validation
        uses: actions/download-artifact@v4
        with:
          name: win-unpacked-app
          path: dist-electron/win-unpacked/

      - name: Validate release assets
        run: node scripts/validate-release-assets.mjs dist-electron

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/Dev Toolbox Setup *.exe
            dist-electron/Dev Toolbox Setup *.exe.blockmap
            dist-electron/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
